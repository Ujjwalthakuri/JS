<body>
    <h5>64. Write a JavaScript program to concatenate two strings and return the result. If the length of the strings does not match, then remove the characters from the longer string.  </h5>

    <script>
        function connect(str1, str2){
            if(str1.length==str2.length){
                return str1.concat(str2);
            }else{
                let m=Math.min(str1.length, str2.length);
                return str1.substring(str1.length-m)+ str2.substring(str2.length - m);
            }
        }
        console.log(connect("java", "HTML"));
        console.log(connect("Java", "Script"));
    </script>
</body>
