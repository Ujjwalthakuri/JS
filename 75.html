    <h5>75. Write a JavaScript program to create an array taking the middle elements of the two arrays of integer and each length 3</h5>

        // function middle(ary1, ary2){

        function middle(a, b) 
{
  var new_array = []
  new_array.push(a[1], b[1]);

    return new_array;
}

        console.log(middle([1, 2, 3],[4, 6, 3]));
        console.log(middle([1, 4, 3],[4, 10, 3]));
