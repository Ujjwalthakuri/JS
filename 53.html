   <h5>53. Write a JavaScript program to check whether the characters a and b are separated by exactly 3 places anywhere (at least once) in a given string.  </h5>

    <script>
        function check(str){
           return (/a...b/).test(str) || (/b...a/).test(str);
        }

        console.log(check("chainsbreak"));
        console.log(check("chainbreak"));
    </script>
</body>
