<body>
    <h5>60. Write a JavaScript program to create a new string without the first and last characters of a given string.  </h5>

    <script>
        function create(str){
            let strlen=str.length;
            return str.substring(1, strlen-1);
        }
        console.log(create("javascript"));
        console.log(create("React"));
        console.log(create("python"));
    </script>
</body>
