<body>
    <h5>80. Write a JavaScript program to swap the first and last elements of a given array of integers. The array length should be at least 1.  </h5>

    <script>
        function swap(arra){
             [arra[0], arra[arra.length - 1]] = [arra[arra.length - 1], arra[0]];
    return arra;
        }

        console.log(swap([1, 2, 3]));
        console.log(swap([1, 2, 3, 4]));
        console.log(swap([1, 2,]));
    </script>
</body>
