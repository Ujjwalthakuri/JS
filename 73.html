<body>
    <h5>73. Write a JavaScript program to reverse the elements of a given array of integers of length 3.  </h5>
    
    <script>
        function rev(array){
            return array.map((element, idx, arr) => arr[(arr.length - 1) - idx]);
        }
        console.log(rev([1, 2, 3]));
        console.log(rev([7, 9, 3]));
    </script>
</body>
