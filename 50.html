<body>
    <h5>50. Write a JavaScript program to capitalize the first letter of each word in a given string.  </h5>

    <script>
        function cap(str){
            str=str.split(" ");
            for(let i=0; i<str.length; i++){
                str[i]=str[i][0].toUpperCase()+str[i].substr(1);
            } 
            return str.join(" ");
        }
        console.log(cap("java script"));
        console.log(cap("pPTHON is good"));
    </script>
</body>
