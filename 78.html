<body>
    <h5>78. Write a JavaScript program to test whether an array of integers of length 2 does not contain 1 or 3.  </h5>

    <script>
        function test(arr){
            if(arr.indexOf(1)==-1 && arr.indexOf(3)==-1){
                return true;
            }else{
                return false;
            }
        }
        console.log(test([1, 3]));
        console.log(test([1, 4]));
        console.log(test([4, 3]));
        console.log(test([4, 7]));
    </script>
</body>
