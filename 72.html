<body>
    <h5>72. Write a JavaScript program to check whether the first and last elements are the same in a given array of integers of length 3.  </h5>

    <script>
        function check(array){
            if(array.length==3){
                let first=array[0];
                let last=array[array.length-1];
                if(first==last){
                    return true;
                }else{
                    return false;
                }
            }else{
                return false;
            }
        }
        console.log(check([2, 3, 2]));
        console.log(check([2, 3, 4]));
        console.log(check([1, 3, 2, 1]));
        console.log(check([1, 3]));
        console.log(check([1, 3, 1]));
    </script>
</body>
