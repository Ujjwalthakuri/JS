<body>
    <h5>57. Write a JavaScript program to create one string of specified copies (positive numbers) of a given string.  </h5>

    <script>
        function copy(str, n){
            if(n!=5){
                return false;
            }else{
            return str.repeat(n);
        }
    }

        console.log(copy("abc", 5));
        console.log(copy("Js", 0));
    </script>
</body>
