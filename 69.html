    <h5>69. Write a JavaScript program to compute the sum of three elements of a given array of integers of length 3.  </h5>

    <script>
        function sum(array){
           return [array[0]+array[1]+array[2]];
    }
    console.log(sum([10, 50, 30]));
        console.log(sum([10, 50, 10]));
    </script>
