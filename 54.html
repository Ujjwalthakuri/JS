<body>
    <h5>54. Write a JavaScript program to count the number of vowels in a given string.  </h5>

    <script>
        function count(str){
             return str.replace(/[^aeiou]/g, "").length; 
        }
        console.log(count("Javascript"));
        console.log(count("React"));
    </script>
