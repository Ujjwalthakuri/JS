   <h5>52. Write a JavaScript program to convert letters of a given string alphabetically. </h5>

   <script>
    function convert(str){
        str=str.split("");
        return str.sort().join("");
    }
    console.log(convert("javascript"));
    console.log(convert("abcdE"));
    console.log(convert("python"));
    </script>
</body>
