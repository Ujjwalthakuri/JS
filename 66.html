<body>
    <h5>66. Write a JavaScript program to display the city name if the string begins with "Los" or "New" otherwise return blank.  </h5>

    <script>
        function city(str){
            if(str.substr(0, 3)=="Los" || str.substr(0, 3)=="New"){
                return "City Name="+str;
            }else{
                return false;
            }
        }
        console.log(city("LosVegas"));
        console.log(city("Newyork"));
        console.log(city("KTM"));
    </script>
</body>
