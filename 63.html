<body>
    <h5>63. Write a JavaScript program to create a string using the middle three characters of a given string of odd length. The string length must be greater than or equal to three. </h5>

    <script>
        function Middle(str){
           if(str.length%2!=0){
            mid=(str.length+1)/2;
            return str.slice(mid-2, mid+1);
           }
           return str;
        }
            console.log(Middle("abcdefg"));
            console.log(Middle("shivamboy"));
    </script>
</body>
