    <h5>67. Write a JavaScript program to create a new string from a given string. This program removes the first and last characters of the string if the first or last character is 'P'. Return the original string if the condition is not satisfied. </h5>

    <script>
        function check(str){
            if(str.substr(0,1)=="p" && str.substr(str.length-1)=="p"){
                return str.substr(1, str.length-2);
            }
            else{
                return str;
            }
        }
        console.log(check("javascript"));
        console.log(check("pythonp"));
        console.log(check("php"));
    </script>
</body>
