<body>
    <h5>65. Write a JavaScript program to test whether a string ends with " Script". The string length must be greater than or equal to 6.  </h5>

    <script>
        function check(str){
           if(str.substring(str.length-6, str.length)=="script"){
                return true;
           }else{
            return false;
           }
        }
        console.log(check("javascript"));
        console.log(check("python"));
        console.log(check("html")); 
    </script>
</body>
